<!-- Textual sign-up prompt: a second way into the same menu for anonymous
     users, alongside the icon trigger that sits flush right. -->
<ng-container *transloco="let t">
  @if (!authService.isAuthenticated()) {
    <button
      type="button"
      class="auth-signup-text-button"
      (click)="openSignup()"
    >
      {{ t('auth.Sign up') }}
    </button>
  }
</ng-container>

<app-dialog-menu position="top-right" width="38rem" (triggerClick)="onProfileTriggerClick()" (opened)="onMenuOpened()" (closed)="onMenuClosed()">
  <!-- Profile Menu Button: the account entry point. Shows profile content
       when authenticated, the log-in view otherwise. -->
  <span
    menu-trigger
    class="auth-menu-button"
  >
    <i class="pi pi-user" [class.active-route]="isProfileRoute()"></i>
  </span>

  <!-- Auth Menu Content -->
  <div menu-content *transloco="let t">
    @if (authService.isAuthenticated() || showUserMenu()) {
      <!-- Profile View: the full profile when authenticated; the same
           component in its anonymous variant (log-in action) otherwise -->
      <div menu-header class="menu-auth-header">
        <h3>{{ t('profile.Profile') }}</h3>
        <hr />
      </div>

      <div menu-body appScrollIndicator class="menu-auth-body">
        <app-auth-profile
          [autoCloseSeconds]="autoCloseTimer()"
          (profileClick)="onViewProfile()"
          (loginClick)="onUserMenuLogin()"
          (logoutClick)="onLogout()"
        />
      </div>

    } @else {
      <!-- Login/Signup/Reset View (when not authenticated) -->
      <div menu-header class="menu-auth-header">
        <div class="auth-tabs">
          <button
            type="button"
            class="auth-tab"
            [class.active]="authUiState.mode() === 'signup'"
            (click)="setMode('signup')"
          >
            {{ t('auth.Sign up') }}
          </button>
          <button
            type="button"
            class="auth-tab"
            [class.active]="authUiState.mode() === 'login'"
            (click)="setMode('login')"
          >
            {{ t('auth.Log in') }}
          </button>
        </div>
        <hr />
      </div>

      <div menu-body appScrollIndicator class="menu-auth-body">
        @if (authUiState.awaitingOtpVerification()) {
          <!-- OTP Verification -->
          <app-auth-otp
            [email]="authUiState.pendingEmail()!"
            [beforeAuthUpdate]="storagePromotionCallback"
            (backToSignup)="onBackToSignup()"
            (switchToLogin)="setMode('login')"
            (verifySuccess)="onVerifySuccess()"
          />

        } @else if (authUiState.mode() === 'reset') {
          <!-- Password Reset -->
          <app-auth-reset
            [prefillEmail]="authUiState.loginFormEmail()"
            (switchToLogin)="setMode('login')"
            (resetSuccess)="onResetSuccess()"
          />

        } @else if (authUiState.mode() === 'signup') {
          <!-- Signup -->
          <app-auth-signup
            #signupForm
            (switchToLogin)="setMode('login')"
            (signupSuccess)="onSignupSuccess($event)"
          />

        } @else {
          <!-- Login (default) -->
          <app-auth-login
            #loginForm
            [beforeSession]="storagePromotionCallback"
            (switchToReset)="onSwitchToReset($event)"
            (switchToSignup)="setMode('signup')"
            (loginSuccess)="onLoginSuccess()"
          />
        }
      </div>
    }
  </div>
</app-dialog-menu>
