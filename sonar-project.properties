# SonarCloud project settings
sonar.projectKey=TheGameKnave_angular-momentum
sonar.organization=thegameknave
sonar.projectName=Angular momentum
sonar.projectVersion=21.6.0

# SonarCloud server
sonar.host.url=https://sonarcloud.io

# Source code settings
sonar.sources=client/src,server,shared
sonar.tests=tests/
sonar.test.inclusions=**/*.spec*
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

# Exclusions (adjust paths as needed)
# Use backslash for line continuation
sonar.exclusions=\
  **/src-tauri/**,\
  **/vendors/**,\
  **/tests/**,\
  **/environments/**,\
  **/karma.conf.js,\
  **/karma-setup.js,\
  **/transloco.config.ts,\
  **/eslint.config.js,\
  **/main.ts,\
  bump_version.js,\
  **/client/scripts/**,\
  **/email_templates/**/*.html,\
  **/migrations/**/*.sql,\
  lighthouserc.js

# Coverage exclusions (files that don't need test coverage)
# - Server-side SSR files (tested via E2E, not Karma)
# - Config/setup files
# - Constants (no logic to test)
sonar.coverage.exclusions=\
  **/karma-setup.js,\
  **/karma.conf.js,\
  **/constants/**/*.ts,\
  **/environments/**,\
  **/supabase/functions/**/*.ts,\
  shared/languages.ts,\
  client/server.ts,\
  client/screenshot-service.ts,\
  **/main.server.ts,\
  **/app.config.server.ts,\
  **/ssr-language.provider.ts

# Duplication exclusions (localization/i18n files with expected structural repetition)
sonar.cpd.exclusions=\
  **/send-auth-email/templates.ts,\
  **/migrations/**/*.sql,\
  **/data/notifications.ts,\
  **/data/changeLog.ts

# Rule settings
sonar.issue.ignore.multicriteria=e1,e2,e3

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# "<dt> item tags should be in <dl> container tags": the <dt>/<dd> pairs ARE
# inside a <dl>, grouped in <div> wrappers. That has been valid HTML since
# HTML 5.2 and is the only way to make each term/description pair a single CSS
# grid/flex child (.info-row, .status-grid). Removing the wrappers to satisfy
# the rule would break the layout. The check predates the spec change.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.html

# S2925 "fixed waits should not be used in tests": correct for render waits,
# wrong for the three in performance.spec.ts. Those are measurement windows
# that let the JS heap settle before sampling performance.memory — "the heap
# has settled" is not an observable condition, and polling it would sample a
# moving number instead of a quiescent one.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.e3.resourceKey=**/performance.spec.ts
